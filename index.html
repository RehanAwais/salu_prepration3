  const container = document.getElementById('questionsContainer');
  const letters = ['A', 'B', 'C', 'D'];

  questions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    let extraClass = '';

    if (item.lang === 'sindhi') extraClass = 'sindhi';

    card.appendChild(qText);

    optionsDiv.className = 'options';

    item.options.forEach((opt, optIndex) => {
      const label = document.createElement('label');
      label.className = 'option';
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = `q${index}`;
      radio.value = optIndex;
      radio.dataset.qIndex = index;
      radio.dataset.optIndex = optIndex;
      label.appendChild(radio);
      const span = document.createElement('span');
      let optClass = '';
      if (item.lang === 'urdu') optClass = 'urdu';
      if (item.lang === 'sindhi') optClass = 'sindhi';
      span.className = optClass;
      span.textContent = `${letters[optIndex]}. ${opt}`;

    container.appendChild(card);
  });

  // ==============================================================
  // SUBMIT
  // ==============================================================
  const submitBtn = document.getElementById('submitBtn');
  const resultArea = document.getElementById('resultArea');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const feedbackSummary = document.getElementById('feedbackSummary');
  const detailList = document.getElementById('detailList');

  submitBtn.addEventListener('click', function () {
    // Check if all attempted
    let allAttempted = true;
    for (let i = 0; i < questions.length; i++) {
      if (!document.querySelector(`input[name="q${i}"]:checked`)) {
        allAttempted = false;
        break;
      }
    }
    if (!allAttempted) {
      alert('⚠️ Please attempt all 100 questions before submitting.');
      return;
    }

    // Score
    let score = 0;
    const userAnswers = [];
    for (let i = 0; i < questions.length; i++) {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      const val = selected ? parseInt(selected.value) : -1;
      userAnswers.push(val);
      if (val === questions[i].correct) score++;
    }

    // Show result
    resultArea.classList.add('show');
    scoreDisplay.innerHTML = `${score} / ${questions.length}`;
    const wrong = questions.length - score;
    feedbackSummary.innerHTML = `
      <span class="correct-badge">✅ Correct: ${score}</span>
      <span class="incorrect-badge">❌ Incorrect: ${wrong}</span>
    `;

    // Detail list
    detailList.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const isCorrect = userAnswers[i] === questions[i].correct;
      const detail = document.createElement('div');
      detail.className = 'detail-item';
      detail.innerHTML = `
        <span class="detail-num">Q${i + 1}</span>
        <span>Your: ${userAnswers[i] >= 0 ? letters[userAnswers[i]] : '—'} | Correct: ${letters[questions[i].correct]}</span>
        <span class="detail-status ${isCorrect ? 'status-correct' : 'status-wrong'}">${isCorrect ? '✓' : '✗'}</span>
      `;
      detailList.appendChild(detail);
    }

    resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Highlight selected
  document.querySelectorAll('.option input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', function () {
      const name = this.name;
      document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
        r.closest('.option').style.background = '';
      });
      if (this.checked) {
        this.closest('.option').style.background = '#d4e6f7';
      }
    });
  });
</script>
</body>
</html>
